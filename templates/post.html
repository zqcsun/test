<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>{{ post.title }}</title>
<style>
body {
margin: 0;
font-family: 'Segoe UI', sans-serif;
background-color: #1c1e26;
color: #e4e6eb;
}
.container {
max-width: 800px;
margin: 60px auto;
background: #262837;
padding: 35px;
border-radius: 18px;
box-shadow: 0 10px 30px rgba(0,0,0,0.45);
}
h1 {
margin-top: 0;
color: #cdd3ff;
}
.content {
margin-top: 20px;
line-height: 1.7;
color: #c6c9dd;
}
.back {
display: inline-block;
margin-top: 30px;
color: #9fa7ff;
text-decoration: none;
}
</style>
</head>
<body>
<div class="container">
<h1>{{ post.title }}</h1>
<div class="content">
{{ post.content }}
</div>
<a href="{% url 'post_list' %}" class="back">← Назад до постів</a>
</div>
</body>
</html>
