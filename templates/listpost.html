<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Пости</title>
<style>
body {
margin: 0;
font-family: 'Segoe UI', sans-serif;
background-color: #1c1e26;
color: #e4e6eb;
}
.container {
max-width: 900px;
margin: 50px auto;
}
.header {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 30px;
}
.header h1 {
margin: 0;
color: #cdd3ff;
}
.btn {
background: #3b3f5c;
color: #ffffff;
padding: 10px 18px;
border-radius: 10px;
text-decoration: none;
transition: 0.3s;
}
.btn:hover {
background: #4a4f73;
}
.post {
background: #262837;
padding: 22px;
margin-bottom: 20px;
border-radius: 16px;
box-shadow: 0 8px 25px rgba(0,0,0,0.35);
}
.post h2 {
margin-top: 0;
color: #bfc6ff;
}
.post p {
color: #c6c9dd;
}
.post a {
color: #9fa7ff;
text-decoration: none;
}
</style>
</head>
<body>
<div class="container">
</html>
